name: Verify source

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 25
    env:
      JJ_VAULT_TEST_BROWSER_CHANNEL: chromium
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check dependency advisories
        run: npm audit --audit-level=moderate
      - name: Install test browser
        run: npx playwright install chromium
      - name: Check TypeScript
        run: npm run typecheck
      - name: Build desktop and extensions
        run: npm run build
      - name: Test core, service, and browser units
        run: npm test
      - name: Test browser installer and connection checks
        run: |
          npx tsx --test tools/test-browser-install.ts
          npm run test:chrome-connection
          npx tsx --test tools/test-package-options.ts
      - name: Test isolated desktop flows
        run: |
          npm run test:desktop
          npm run test:agents
          npm run test:session
          npm run test:phone
          npm run test:browser
          npm run test:browser-pairing
      - name: Test optional hosted relay
        run: npm run test:hosted-relay
      - name: Check source assembly
        run: npm run release:preflight
